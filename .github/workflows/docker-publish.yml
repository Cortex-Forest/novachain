# ============================================================
#  Nova Chain — Git 上自动构建并推送 GHCR（GitHub Container Registry）
#  ------------------------------------------------------------
#  触发方式：
#    1. push 到 main/master            -> 构建并推送 latest
#    2. 打标签 v*（如 v0.11）           -> 构建并推送 v0.11 + latest
#    3. 手动触发（Actions 页 Run workflow）-> 可自定义 tag / 跳过抗量子
#
#  无需配置任何 Secrets！使用 GitHub 自动注入的 GITHUB_TOKEN，
#  构建产物自动推送到 ghcr.io/cortex-forest/novachain。
#  拉取：docker pull ghcr.io/cortex-forest/novachain:latest
# ============================================================

name: Docker 自动构建推送 (GHCR)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: '手动指定的镜像 tag（留空则用 latest）'
        required: false
        default: 'latest'
      skip_oqs:
        description: '跳过抗量子签名（构建更快，回退 Ed25519，仅测试）'
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/cortex-forest/novachain   # = ghcr.io/<GitHub组织或用户名>/<仓库名>（小写）

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # 推送 GHCR 所需

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 如需多平台（例如服务器是 arm64），取消下面注释并在推送步骤打开 platforms：
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v4

      # 登录 GHCR：用 GitHub 自动注入的 GITHUB_TOKEN，零配置
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tags=${IMAGE}:${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NOVA_OQS=${{ github.event.inputs.skip_oqs == 'true' && '0' || '1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 多平台构建示例（会明显拉长构建时间，QEMU 模拟编译慢）：
          # platforms: linux/amd64,linux/arm64
